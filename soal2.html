<!doctype html>
<html lang="id">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Bermain dengan Warna</title>
    <link rel="stylesheet" href="style2.css" />
    <!-- IMPORT CDN  -->
    <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
  </head>
  <body>
    <h1>Bermain dengan Warna</h1>

    <div>
      <button id="tombolUngu">Ungu</button>
      <button id="tombolBiru">Biru</button>
      <button id="tombolHijau">Hijau</button>
    </div>

    <div id="kotakWarna"></div>

    <div>
      <button id="sembunyikanKotak">Sembunyikan Kotak</button>
      <button id="tampilkanKotak">Tampilkan Kotak</button>
    </div>

    <p>Klik tombol warna untuk mengubah warna kotak.</p>
    <p>
      Gunakan tombol Sembunyikan dan Tampilkan untuk menyembunyikan dan
      menampilkan kotak.
    </p>

    <script>
      // Using jQuery
      $(document).ready(function () {
        // Tombol warna: ubah background kotak
        $("#tombolUngu").click(function () {
          $("#kotakWarna").css("background-color", "#7c3aed");
        });

        $("#tombolBiru").click(function () {
          $("#kotakWarna").css("background-color", "#2563eb");
        });

        $("#tombolHijau").click(function () {
          $("#kotakWarna").css("background-color", "#15803d");
        });

        // Tombol sembunyikan kotak
        $("#sembunyikanKotak").click(function () {
          $("#kotakWarna").hide();
        });

        // Tombol tampilkan kotak
        $("#tampilkanKotak").click(function () {
          $("#kotakWarna").show();
        });
      });
    </script>
  </body>
</html>
